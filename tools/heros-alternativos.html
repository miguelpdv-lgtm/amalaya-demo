<!doctype html><meta charset="utf-8">
<!-- Genera 4 alternativas de hero en canvas: abrir con ?op=1..4 desde un servidor local (usa ../assets/fotos/salon.jpg). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&family=Instrument+Sans:wght@400..700&display=swap">
<style>body{margin:0;background:#000}canvas{display:block}</style>
<script src="../design-system/trazo.js"></script>
<canvas id="c" width="1360" height="860"></canvas>
<script>
const W=1360,H=860, SEPIA='#3B2A1D', LIENZO='#F9F0E7', OCRE3='#DFBA87', OCRE4='#CB9B54', CARBON='#1E150E', SIENA='#785C44';
const c=document.getElementById('c'), x=c.getContext('2d');
const op=+new URLSearchParams(location.search).get('op')||1;
function cover(img,dx,dy,dw,dh,fx=.6,fy=.4){const r=Math.max(dw/img.width,dh/img.height),sw=dw/r,sh=dh/r;x.drawImage(img,(img.width-sw)*fx,(img.height-sh)*fy,sw,sh,dx,dy,dw,dh);}
function nav(dark){x.fillStyle=LIENZO;x.fillRect(0,0,W,68);x.fillStyle='#D2BCAB';x.fillRect(0,67,W,1);
  x.save();x.translate(120,15);const s=150/970;x.scale(s,s);x.translate(-50,-362);x.fillStyle=SEPIA;P.word.forEach(p=>x.fill(p));x.restore();
  x.font='500 15px "Instrument Sans"';x.fillStyle=SEPIA;let nx=1061;['Preguntas','Método','Servicios','Tu patrón'].forEach(t=>{const tw=x.measureText(t).width;nx-=tw;x.fillText(t,nx,39);nx-=24;});
  boton(1093,14,148,40,'RESERVAR',SEPIA,LIENZO,OCRE4);}
function boton(bx,by,bw,bh,t,bg,fg,sh,fs=13){x.fillStyle=sh;x.fillRect(bx+4,by+4,bw,bh);x.fillStyle=bg;x.fillRect(bx,by,bw,bh);x.strokeStyle=bg===LIENZO?LIENZO:SEPIA;x.lineWidth=2;x.strokeRect(bx+1,by+1,bw-2,bh-2);
  x.fillStyle=fg;x.font=`650 ${fs}px "Instrument Sans"`;x.letterSpacing='1.8px';x.fillText(t,bx+18,by+bh/2+5);const tw=x.measureText(t).width;x.letterSpacing='0px';
  x.strokeStyle=fg;x.lineWidth=2;x.lineCap='round';const ax=bx+18+tw+12,ay=by+bh/2;x.beginPath();x.moveTo(ax,ay);for(let k=0;k<3;k++){x.quadraticCurveTo(ax+k*6.5+3.2,ay+(k%2?4.5:-4.5),ax+k*6.5+6.5,ay);}x.lineTo(ax+31,ay);x.moveTo(ax+26.5,ay-4.5);x.lineTo(ax+31,ay);x.lineTo(ax+26.5,ay+4.5);x.stroke();}
function eti(t,ex,ey,col){x.strokeStyle=col;x.lineWidth=2;x.beginPath();x.moveTo(ex,ey-4);x.lineTo(ex+32,ey-4);x.stroke();x.fillStyle=col;x.font='500 12px "DM Mono"';x.letterSpacing='2px';x.fillText(t,ex+44,ey);x.letterSpacing='0px';}
function titulo(lines,tx,ty,size,col){x.fillStyle=col;x.font=`500 ${size}px Fraunces`;x.fontVariationSettings;lines.forEach((l,i)=>x.fillText(l,tx,ty+i*size*0.98));}
function texto(lines,tx,ty,col,size=20){x.fillStyle=col;x.font=`400 ${size}px "Instrument Sans"`;lines.forEach((l,i)=>x.fillText(l,tx,ty+i*size*1.45));}
function cinta(y0,h,cols,paso=110,fase=.3){const hebras=cols.length;cols.forEach((col,i)=>{const p=Trazo.PATRONES[i*2];const q={w:p.w*.8,z:p.z*.6};const pts=Trazo.curva(q,{ciclos:Trazo.ciclosPara(q,W/paso+2.2),fase:fase+i*.37,resolucion:60});const b=Trazo.limites(pts);const band=h/hebras*.85;const ky=Math.min(1,band/((b.y1-b.y0)*paso));const cy=(b.y0+b.y1)/2;const yy=y0+h*((i+.5)/hebras);Trazo.pluma(x,pts.map(pt=>({x:-paso+pt.x*paso,y:yy+(pt.y-cy)*paso*ky})),{ancho:5*(1-i*.08),color:col});});}
function costuraV(cx,y0,y1,col,paso=70,w=5){const p={w:1.05,z:0};const pts=Trazo.curva(p,{ciclos:Trazo.ciclosPara(p,(y1-y0)/paso+2),fase:.2,resolucion:60});const b=Trazo.limites(pts);const ancho=(b.y1-b.y0)*paso;const esc=ancho>22?paso*22/ancho:paso;x.save();x.beginPath();x.rect(cx-20,y0,40,y1-y0);x.clip();Trazo.pluma(x,Trazo.colocar(pts,{rot:Math.PI/2,escala:esc,x:cx+(b.y0+b.y1)/2*esc,y:y0-paso}),{ancho:w,color:col});x.restore();}
function chipProv(px,py){x.font='500 11px "DM Mono"';x.letterSpacing='1.5px';const t='IMAGEN PROVISIONAL';const tw=x.measureText(t).width;x.fillStyle='rgba(59,42,29,.72)';x.fillRect(px-tw-20,py,tw+20,26);x.setLineDash([3,3]);x.strokeStyle=OCRE3;x.lineWidth=1;x.strokeRect(px-tw-20+.5,py+.5,tw+19,25);x.setLineDash([]);x.fillStyle=LIENZO;x.fillText(t,px-tw-10,py+17);x.letterSpacing='0px';}
let P={};
(async()=>{
  await document.fonts.load('500 40px Fraunces');await document.fonts.load('400 20px "Instrument Sans"');await document.fonts.load('650 13px "Instrument Sans"');await document.fonts.load('500 12px "DM Mono"');
  const tr=await (await fetch('logo-trazado.json')).json();
  const word=tr.filter(p=>p.bbox[1]<620).sort((a,b)=>a.bbox[0]-b.bbox[0]);
  P.word=word.map(p=>new Path2D(p.d)); P.E=new Path2D(word[0].d);
  const img=new Image(); img.src='../assets/fotos/salon.jpg'; await img.decode();
  x.fillStyle=SEPIA;x.fillRect(0,0,W,H);
  const T=68;
  if(op===1){ // Cartela de galería: foto a sangre + cartela de museo
    cover(img,0,T,W,H-T,.62,.4);
    const g=x.createLinearGradient(0,T,W*.6,T);g.addColorStop(0,'rgba(30,21,14,.55)');g.addColorStop(1,'rgba(30,21,14,0)');x.fillStyle=g;x.fillRect(0,T,W,H-T);
    const cx0=120,cy0=330,cw=520,ch=400;
    x.fillStyle=SEPIA;x.fillRect(cx0+6,cy0+6,cw,ch);x.fillStyle=LIENZO;x.fillRect(cx0,cy0,cw,ch);x.strokeStyle=SEPIA;x.lineWidth=2;x.strokeRect(cx0+1,cy0+1,cw-2,ch-2);
    eti('CALI · B/ CAPRI',cx0+40,cy0+56,SIENA);titulo(['Cada rizo','es un trazo.'],cx0+40,cy0+138,70,SEPIA);
    texto(['Peluquería para cabellos rizados,','ondulados y afros.'],cx0+40,cy0+262,'#654D38',19);
    x.font='500 11px "DM Mono"';x.fillStyle='#654D38';x.letterSpacing='1.5px';x.fillText('OBRA N.º 3B · TÉCNICA: CORTE A FAVOR DEL RIZO',cx0+40,cy0+ch-30);x.letterSpacing='0px';
    boton(cx0+40,cy0+300,170,48,'TU PATRÓN',SEPIA,LIENZO,OCRE4);
    chipProv(W-14,T+12);
  } else if(op===2){ // Tríptico
    const top=T, bot=H-170; const cols=[[0,452],[452+28,452],[452*2+56,W-(452*2+56)]];
    x.fillStyle=SEPIA;x.fillRect(0,top,W,H-top);
    cols.forEach(([cx,cw],i)=>{x.save();x.beginPath();x.rect(cx,top,cw,bot-top);x.clip();cover(img,cx,top,cw,bot-top,[.15,.55,.95][i],.3);x.restore();});
    costuraV(452+14,top,bot,LIENZO);costuraV(452*2+42,top,bot,LIENZO);
    x.fillStyle=OCRE4;x.fillRect(0,bot,W,3);
    eti('CALI · B/ CAPRI',120,bot+52,OCRE3);titulo(['Cada rizo es un trazo.'],120,bot+122,62,LIENZO);
    texto(['Rizados, ondulados y afros.','Leemos tu textura antes de cortarla.'],720,bot+70,'#E7D8CB',19);
    boton(1090,bot+48,150,46,'TU PATRÓN',LIENZO,SEPIA,OCRE4);
    chipProv(W-14,T+12);
  } else if(op===3){ // Pluma: foto vertical enmarcada + E monumental
    x.fillStyle=SEPIA;x.fillRect(0,T,W,H-T);
    x.save();x.translate(-40,T-20);x.scale(3.1,3.1);x.translate(-60,-372);x.strokeStyle='rgba(223,186,135,.22)';x.lineWidth=1.1;x.stroke(P.E);x.restore();
    const fx=812,fy=T+48,fw=430,fh=H-T-48-112;
    x.fillStyle=OCRE4;x.fillRect(fx+10,fy+10,fw,fh);cover(img,fx,fy,fw,fh,.7,.4);x.strokeStyle=LIENZO;x.lineWidth=2;x.strokeRect(fx+1,fy+1,fw-2,fh-2);
    eti('CALI · B/ CAPRI',120,300,OCRE3);titulo(['Cada rizo','es un trazo.'],120,390,84,LIENZO);
    texto(['Peluquería para cabellos rizados, ondulados','y afros. Leemos tu textura antes de cortarla.'],120,520,'#E7D8CB',20);
    boton(120,580,170,50,'TU PATRÓN',LIENZO,SEPIA,OCRE4);
    cinta(H-80,80,[LIENZO,OCRE3],120,.6);
    chipProv(fx+fw-10,fy+10);
  } else { // Banda: foto panorámica arriba, cinta y titular abajo
    const fb=T+430;
    cover(img,0,T,W,fb-T,.6,.55);
    const g=x.createLinearGradient(0,fb-120,0,fb);g.addColorStop(0,'rgba(59,42,29,0)');g.addColorStop(1,'rgba(59,42,29,1)');x.fillStyle=g;x.fillRect(0,fb-120,W,120);
    x.fillStyle=SEPIA;x.fillRect(0,fb,W,H-fb);
    cinta(fb-60,100,[LIENZO,OCRE3,'#D2BCAB'],110,.15);
    eti('CALI · B/ CAPRI',120,fb+96,OCRE3);titulo(['Cada rizo es un trazo.'],120,fb+186,80,LIENZO);
    texto(['Peluquería para cabellos rizados, ondulados y afros.','Leemos tu textura antes de cortarla.'],120,fb+252,'#E7D8CB',20);
    boton(1070,fb+200,170,50,'TU PATRÓN',LIENZO,SEPIA,OCRE4);
    chipProv(W-14,T+12);
  }
  nav();
  document.title='listo';
})();
</script>
